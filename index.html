<!DOCTYPE html>
<!--
  ============================================================================
  THE STORY NIGHT  —  interactive 3D flipbook (Neel & the dragon)
  ----------------------------------------------------------------------------
  • No build step, no frameworks. Just open this file in any modern browser.
  • A real 3D hardcover book: it has thickness, a spine, sits angled and casts a
    soft shadow. Tap PLAY to open it (the cover swings on the spine), then flip.
  • Full-bleed picture-book pages: page 1 is a video, pages 2-4 are scenes with
    a speech bubble that pops in once you fully land on the page.
  • Structure is split into THREE files:
        index.html   → this markup
        styles.css   → all styling + the night theme + animations
        script.js    → the flip engine + the page content (EDIT PAGES THERE)
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>The Royal Fest</title>

<!-- ── Google Fonts: Fredoka, weights 600 + 700 ONLY ─────────────────────────
     TRIMMED to exactly what renders. An audit of every element that draws visible
     text, in every state of the book (loading, cover, each page, THE END and the
     portrait rotate gate), found only these:
         Fredoka 600 → the loading label, "Replay", the rotate prompt
         Fredoka 700 → "THE END"
     Previously also requested, all now dropped:
       • Caveat 500 + 700 — rendered NO text at all. Its only selectors
         (.bookplate .line, .end-note .small, .cover .subtitle, .cover .back .line)
         have no matching markup, so both weights were a pure wasted download.
       • Patrick Hand — the body default, but the only node that inherited it was
         the 🔄 emoji in the rotate prompt, which draws from the system emoji font,
         not from this webfont. So it too rendered no glyphs. --font-hand is now a
         system stack (see styles.css) — same look, zero requests.
       • Fredoka 500 — its only use was .progress, part of the removed page counter.
     Re-check with: node _dev/font-audit.js -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
  rel="stylesheet"
/>

<!-- All styling lives in styles.css -->
<link rel="stylesheet" href="styles.css" />
</head>

<body>
<!-- Landscape lock: on phones/tablets (touch), the book shows only in landscape.
     In portrait the scene is hidden and this rotate prompt is shown instead. -->
<div class="rotate-notice" id="rotateNotice">
  <div class="rotate-inner">
    <div class="rotate-icon">🔄</div>
    <div class="rotate-text">Please rotate your device<br />to landscape to read</div>
  </div>
</div>
<div class="scene">
  <div class="stage">
    <!-- Fixed 1280×720 book layer. JS scales it (transform) to fit the screen. -->
    <div class="flip-scale" id="flipScale">
    <!-- INNER scale wrapper: the open motion runs here, so it composes with the
         outer responsive scale of .flip-scale. -->
    <div class="book-stage" id="bookStage">
    <!-- Outer hardcover outline — visible once the book is open -->
    <div class="book-frame"></div>
    <div class="floor-shadow"></div>

    <!-- The page-turning book mounts here (JS injects one .leaf per page).
         Sits beneath the 3D cover layer; revealed once the cover swings open.
         .page-stack = the tan fore-edge of the pages still to be turned (right). -->
    <div id="flipbook">
      <div class="page-stack" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Moving shadow the opening cover casts on the inside page. -->
    <div class="cover-cast"></div>

    <!-- The 3D hardcover + cover-opening animation (own perspective layer). -->
    <div class="cover-scene" id="coverScene">
    <div class="book-float" id="bookFloat">
      <div class="book-pop" id="bookPop">
        <div class="book" id="book">
          <div class="book-inner" id="bookInner">

            <!-- Open-book back cover backing -->
            <div class="book-body"></div>

            <!-- The 3D page block that gives the closed book its thickness -->
            <div class="pageblock">
              <div class="pbf pb-back"></div>
              <div class="pbf pb-left"></div>
              <div class="pbf pb-right"></div>
              <div class="pbf pb-top"></div>
              <div class="pbf pb-bottom"></div>
              <div class="pbf pb-front"></div>
            </div>

            <!-- Front hardcover (last so it stacks in front when closed). -->
            <div class="cover-holder">
            <div class="cover" id="cover">
              <div class="face front">
                <div class="cover-img"></div>
                <div class="back-fill"></div>
                <div class="curl"></div>
                <!-- START button — the artwork the user supplied (assets/play button.webp),
                     shown via CSS background. Sits low over the empty courtyard floor so
                     it never overlaps the title, the genie or the railing.
                     HIDDEN until every asset is fetched: preloader.js puts
                     body.preloading on at boot and takes it off at 100%, then
                     pops this button in. openBook() is guarded too, so keyboard
                     and programmatic starts wait exactly the same way. -->
                <button class="play-btn" id="hint" type="button" aria-label="Start — open the book"></button>

                <!-- LOADING BAR — occupies the START button's spot until 100% of the
                     assets (see preload-manifest.js) have been fetched. Themed to the
                     cover: royal-plum track, gold fill, gold hairline. -->
                <div class="preload" id="preloadBar" role="progressbar"
                     aria-label="Loading the story" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="preload-track"><div class="preload-fill" id="preloadFill"></div></div>
                  <div class="preload-label">Loading the story… <span id="preloadPct">0%</span></div>
                </div>
              </div>
              <!-- BACK of the front cover: intentionally BLANK (plain dark board). -->
              <div class="face back"></div>
            </div>
            </div><!-- /cover-holder -->

          </div>
        </div>
      </div>
    </div>
    </div><!-- /cover-scene -->

    <!-- Flat, top-most, transparent tap zone that only OPENS the book. -->
    <div class="tap-catcher" id="tapCatcher"></div>

    <!-- (THE END is now a real final PAGE — the last leaf, built by script.js:
         a cream "paper" page with "THE END" + a Replay button. Replay closes the
         whole book, reverse of the opening swing, back to the front cover.) -->
    </div><!-- /book-stage -->
    </div><!-- /flip-scale -->
  </div>

  <!-- Progress read-out -->
  <!-- (page counter removed) -->
</div>

<!-- HOME button — top-left, shown only while reading (hidden on the cover, the
     last page and the end). Closes the book (reverse of the opening swing) back
     to the front cover. -->
<button class="home-btn" id="homeBtn" type="button" aria-label="Back to the cover">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
  </svg>
</button>

<!-- Flip arrows OUTSIDE the book, fixed at the viewport's bottom corners
     (bottom-left = back, bottom-right = forward). -->
<button class="corner-arrow back" id="cornerPrev" aria-label="Previous page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>
<button class="corner-arrow fwd" id="cornerNext" aria-label="Next page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>

<!-- EMBEDDED GAME OVERLAY — the "LBD 1" handspan game, shown as a page.
     It lives here at BODY level (not inside the 3D book) so it can grow to a
     true full-screen box: a CSS transform on .flip-scale would otherwise trap
     position:fixed and break real fullscreen. script.js loads the game into the
     iframe only once the reader lands on the game page, sizes/positions the
     overlay, and expands it to full screen. -->
<div class="lbd-stage" id="lbdStage" aria-hidden="true">
  <iframe id="lbdFrame" title="Handspan Game" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<!-- Inlined one-shot SFX (base64) for glitch-free Web Audio playback on file:// -->
<script src="sfx-data.js"></script>
<!-- GENERATED size table for the loading bar (node _dev/asset-inventory.js) -->
<script src="preload-manifest.js"></script>
<!-- Preloader runs FIRST so the bar is on screen from the first paint and the
     START button stays hidden until every asset is local. -->
<script src="preloader.js"></script>
<!-- All behaviour lives in script.js -->
<script src="script.js"></script>
</body>
</html>
